version: '3.8'

services:
  meridian-fx:
    build: .
    container_name: meridian-fx-backend
    ports:
      - "10000:10000"
    environment:
      - FRED_API_KEY=${FRED_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY}
      - TWELVE_DATA_KEY=${TWELVE_DATA_KEY}
      - PYTHON_VERSION=3.12.0
    volumes:
      - ./models:/app/models
      - ./cache:/app/cache
    restart: unless-stopped
