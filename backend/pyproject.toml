[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-fx"
version = "2.3.0"
description = "Meridian FX — Financial Intelligence & Decision Support System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Daniel Canedo", email = "daniel@stratusintelligence.com"}
]
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Data Processing
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    
    # Machine Learning
    "xgboost>=3.0.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    
    # HTTP Client
    "httpx>=0.27.0",
    "requests>=2.32.0",
    
    # Data Sources
    "yfinance>=0.2.38",
    "alpha-vantage>=2.3.1",
    "twelvedata>=1.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "joblib>=1.4.0",
    
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
meridian-fx = "layer1.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
