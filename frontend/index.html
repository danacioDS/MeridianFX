    <script>
      // Polyfill para RegExp flag 'd' y otros flags modernos
      (function() {
        if (typeof RegExp === 'undefined') return;
        if ('indices' in RegExp.prototype) return;
        
        console.log('[MeridianFX] Aplicando polyfill para RegExp');
        
        // Guardar el exec original
        const originalExec = RegExp.prototype.exec;
        
        RegExp.prototype.exec = function(str) {
          const result = originalExec.call(this, str);
          if (result && this.hasIndices !== undefined) {
            // Simular la propiedad 'indices'
            result.indices = {
              groups: {},
              length: 0
            };
          }
          return result;
        };
        
        // Si el flag 'd' está presente, procesarlo
        const originalCompile = RegExp.prototype.compile;
        RegExp.prototype.compile = function(pattern, flags) {
          // Eliminar flag 'd' si está presente
          if (flags && flags.includes('d')) {
            flags = flags.replace(/d/g, '');
          }
          return originalCompile.call(this, pattern, flags);
        };
      })();
    </script>
